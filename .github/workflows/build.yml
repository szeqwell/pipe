
name: Build and Push FotoShow Image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/fotoshow

jobs:
  build:
    name: Build application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout pipeline repository
        uses: actions/checkout@v4

      - name: Checkout FotoShow source
        uses: actions/checkout@v4
        with:
          repository: szeqwell/workshop
          path: source

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build FotoShow
        working-directory: source/fotoshow-main
        run: mvn -B clean package

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./source/fotoshow-main
          push: true
          tags: ${{ env.IMAGE_NAME }}:latest

