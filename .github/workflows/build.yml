
name: Build and Push FotoShow Image

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/szeqwell/fotoshow:latest

jobs:
  # JOB 1: Build and test the Java application
  build:
    name: Build application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout FotoShow source
        uses: actions/checkout@v4
        with:
          repository: szeqwell/workshop
          path: source

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: source/fotoshow-main/pom.xml

      - name: Build and test FotoShow
        working-directory: source/fotoshow-main
        run: mvn -B clean package

      - name: Package source workspace
        run: |
          tar -czf "$RUNNER_TEMP/fotoshow-workspace.tar.gz" \
            --exclude=target \
            --exclude=build \
            --exclude=.git \
            -C source fotoshow-main

      - name: Upload workspace artifact
        uses: actions/upload-artifact@v4
        with:
          name: fotoshow-workspace
          path: ${{ runner.temp }}/fotoshow-workspace.tar.gz
          retention-days: 1

  # JOB 2: Build the Docker image
  create-image:
    name: Create Docker image
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download workspace artifact
        uses: actions/download-artifact@v4
        with:
          name: fotoshow-workspace
          path: workspace

      - name: Extract workspace
        run: |
          tar -xzf workspace/fotoshow-workspace.tar.gz \
            -C workspace

      - name: Build Docker image
        run: |
          docker build \
            -t "$IMAGE_NAME" \
            ./workspace/fotoshow-main

      - name: Save Docker image to TAR
        run: docker save -o "$RUNNER_TEMP/fotoshow.tar" "$IMAGE_NAME"

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: fotoshow-image
          path: ${{ runner.temp }}/fotoshow.tar
          retention-days: 1

  # JOB 3: Push the image to GHCR
  push:
    name: Push image to GHCR
    needs: create-image
    runs-on: ubuntu-latest

    steps:
      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: fotoshow-image
          path: image

      - name: Load Docker image
        run: docker load -i image/fotoshow.tar

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image to GHCR
        run: docker push "$IMAGE_NAME"
